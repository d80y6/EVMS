apiVersion: v1
kind: ConfigMap
metadata:
  name: ingest-service-config
  namespace: media
data:
  RUST_LOG: "info"
  INGEST__RTSP_PORT: "554"
  INGEST__HTTP_PORT: "8080"
  INGEST__S3_BUCKET: "media-storage"
  INGEST__AWS_REGION: "us-east-1"
  INGEST__S3_PREFIX: "streams/"
  INGEST__SEGMENT_DURATION_MS: "2000"
  INGEST__JITTER_BUFFER_SIZE: "1000"
  INGEST__JITTER_BUFFER_DELAY_MS: "500"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
  namespace: media
  labels:
    app: ingest-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ingest-service
  template:
    metadata:
      labels:
        app: ingest-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ingest-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ingest-service
          image: ingest-service:latest
          imagePullPolicy: Always
          ports:
            - name: rtsp
              containerPort: 554
              protocol: UDP
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ingest-service-config
            - secretRef:
                name: ingest-service-secrets
                optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ingest-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-service
  namespace: media
  labels:
    app: ingest-service
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: rtsp
      port: 554
      targetPort: rtsp
      protocol: UDP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: ingest-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest-service
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingest-service-role
  namespace: media
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingest-service-rolebinding
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ingest-service-role
subjects:
  - kind: ServiceAccount
    name: ingest-service
    namespace: media
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingest-service-hpa
  namespace: media
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingest-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
