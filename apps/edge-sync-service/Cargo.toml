[package]
name = "edge-sync-service"
version = "0.1.0"
edition = "2021"
authors = ["Edge AI Platform Team"]
description = "Edge offline synchronization service with conflict resolution"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
prost = "0.12"
prost-types = "0.12"

# Networking
tonic = "0.10"
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.21"
hyper = { version = "1.1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Storage
sled = "0.34"
rocksdb = "0.21"
parquet = "49.0"
arrow = "49.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.21"
metrics-exporter-prometheus = "0.13"

# Cryptography
ring = "0.17"
base64 = "0.21"

# Compression
flate2 = "1.0"
lz4_flex = "0.11"

# Vector clocks
crdt = "0.5"

# Feature flags
async-trait = "0.1"
futures = "0.3"
bytes = "1.5"
parking_lot = "0.12"
dashmap = "5.5"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"

[[bin]]
name = "edge-sync"
path = "src/main.rs"

[lib]
name = "edge_sync"
path = "src/lib.rs"

[[bench]]
name = "sync_bench"
harness = false

[build-dependencies]
tonic-build = "0.10"
