port: 4222
server_name: "evms-nats-0"

http: 8222

jetstream: {
  store_dir: "/data/jetstream"
  max_memory_store: 1073741824
  max_file_store: 53687091200
}

max_payload: 8388608

# TLS configuration - uncomment and set cert paths to enable NATS TLS
# tls: {
#   cert_file: "/etc/nats/certs/tls.crt"
#   key_file: "/etc/nats/certs/tls.key"
#   ca_file: "/etc/nats/certs/ca.crt"
#   verify: true
#   timeout: 5
# }

authorization: {
  default_permission: {
    subscribe: ["_INBOX.>", "camera.>"]
    publish: ["_INBOX.>", "camera.>"]
  }
}
