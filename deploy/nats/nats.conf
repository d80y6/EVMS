port: 4222

http: 8222

jetstream: {
  store_dir: "/data/jetstream"
  max_memory_store: 1073741824
  max_file_store: 53687091200
}

cluster {
  port: 6222
  listen: "0.0.0.0:6222"
}

max_payload: 8388608

disable_old_style: true

authorization: {
  default_permission: {
    subscribe: ["_INBOX.>"]
    publish: ["_INBOX.>"]
  }

  # Ingest: publishes frame/H264 data and recording notifications
  ingest: {
    publish: [
      "camera.>.frames"
      "camera.>.h264"
      "camera.>.recordings.new"
    ]
  }

  # AI Worker: subscribes to frames, publishes detections + facial
  ai_worker: {
    subscribe: ["camera.>.frames", "blur.request"]
    publish: [
      "camera.>.events"
      "camera.>.facial"
      "blur.completed"
    ]
  }

  # Recorder: subscribes to H264 + recording notifications, uses KV store
  recorder: {
    subscribe: [
      "camera.>.h264"
      "camera.*.recordings.new"
    ]
    publish: ["$KV.recorder_leader.>"]
  }

  # WebRTC: subscribes to H264 streams for live viewing
  webrtc: {
    subscribe: ["camera.>.h264"]
  }

  # Event Processing: consumes detections, publishes tracks/alerts/notifications
  event_processor: {
    subscribe: [
      "camera.*.events"
    ]
    publish: [
      "camera.>.tracks"
      "alerts.triggered"
      "notifications.push"
    ]
  }

  # Metadata: subscribes to AI events for storage
  metadata: {
    subscribe: ["camera.*.events"]
  }

  # Notification: receives push notifications
  notification: {
    subscribe: ["notifications.push"]
  }

  # Audit: self-publish + self-subscribe for audit log
  audit: {
    subscribe: ["audit.log"]
    publish: ["audit.log"]
  }

  # Discovery: publishes discovered cameras
  discovery: {
    publish: ["cameras.discovered"]
  }

  # ONVIF Events: publishes camera events
  onvif_events: {
    publish: ["camera.>.onvif_events"]
  }

  # POS Ingest: publishes POS transaction data
  pos_ingest: {
    publish: ["pos.transaction"]
  }
}
