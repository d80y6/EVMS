global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
  - match:
      severity: critical
    receiver: 'critical'
    repeat_interval: 1h
  - match:
      severity: warning
    receiver: 'default'

receivers:
- name: 'default'
  slack_configs:
  - channel: '#evms-alerts'
    title: '{{ .GroupLabels.alertname }}'
    text: '{{ .CommonAnnotations.description }}'
    send_resolved: true

- name: 'critical'
  slack_configs:
  - channel: '#evms-critical'
    title: '[CRITICAL] {{ .GroupLabels.alertname }}'
    text: '{{ .CommonAnnotations.description }}'
    send_resolved: true
  pagerduty_configs:
  - routing_key: '${PAGERDUTY_ROUTING_KEY}'
    severity: critical
