groups:
  - name: evms
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been unreachable for over 1 minute."

      - alert: HighFrameProcessingRate
        expr: rate(vms_frames_processed_total[5m]) < 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low frame processing rate for camera {{ $labels.camera_id }}"
          description: "Camera {{ $labels.camera_id }} processing < 10 fps for 2 minutes."

      - alert: NoRecordingsIndexed
        expr: rate(vms_recordings_indexed_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No recordings being indexed"
          description: "No recording segments indexed in the last 5 minutes."

      - alert: StreamInactive
        expr: vms_stream_active == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Camera stream {{ $labels.camera_id }} is inactive"
          description: "Camera {{ $labels.camera_id }} has been inactive for over 2 minutes."
