apiVersion: apps/v1
kind: Deployment
metadata:
  name: recorder-service
  namespace: dam-vms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recorder-service
  template:
    metadata:
      labels:
        app: recorder-service
    spec:
      containers:
      - name: recorder
        image: damvms/recorder:latest
        ports:
        - containerPort: 2112
        livenessProbe:
          httpGet:
            path: /health
            port: 2112
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 2112
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: vms-secrets
              key: db-url
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: METRICS_ADDR
          value: ":2112"
        volumeMounts:
        - name: recordings
          mountPath: /recordings
      volumes:
      - name: recordings
        persistentVolumeClaim:
          claimName: recordings-pvc
---
