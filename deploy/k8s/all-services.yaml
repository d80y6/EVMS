apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: dam-vms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth
        image: damvms/auth:latest
        ports:
        - containerPort: 8081
        - containerPort: 2112
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: vms-secrets
              key: db-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vms-secrets
              key: jwt-secret
        - name: METRICS_ADDR
          value: ":2112"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: dam-vms
spec:
  selector:
    app: auth-service
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081
  type: ClusterIP
---
