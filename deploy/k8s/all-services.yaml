apiVersion: apps/v1
kind: Deployment
metadata:
  name: thumbnails
  namespace: dam-vms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thumbnails
  template:
    metadata:
      labels:
        app: thumbnails
    spec:
      containers:
      - name: thumbnails
        image: damvms/thumbnails:latest
        ports:
        - containerPort: 8089
        - containerPort: 2112
        livenessProbe:
          httpGet:
            path: /health
            port: 2112
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 2112
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: METRICS_ADDR
          value: ":2112"
        - name: RECORDINGS_ROOT
          value: "/recordings"
        - name: THUMBNAIL_CACHE
          value: "/cache/thumbnails"
        volumeMounts:
        - name: recordings
          mountPath: /recordings
        - name: thumbnail-cache
          mountPath: /cache/thumbnails
      volumes:
      - name: recordings
        persistentVolumeClaim:
          claimName: recordings-pvc
      - name: thumbnail-cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: thumbnails
  namespace: dam-vms
spec:
  selector:
    app: thumbnails
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8089
  - protocol: TCP
    port: 2112
    targetPort: 2112
  type: ClusterIP
---
