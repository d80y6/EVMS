apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: dam-vms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-worker
  template:
    metadata:
      labels:
        app: ai-worker
    spec:
      containers:
      - name: ai-worker
        image: damvms/ai-worker:latest
        livenessProbe:
          exec:
            command:
            - pgrep
            - python
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          exec:
            command:
            - pgrep
            - python
          initialDelaySeconds: 10
          periodSeconds: 15
        env:
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: CAMERA_ID
          value: "demo_cam"
---
