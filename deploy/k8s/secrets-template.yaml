apiVersion: v1
kind: Secret
metadata:
  name: vms-secrets
  namespace: dam-vms
type: Opaque
  # WARNING: Replace these with secure values before deploying to production
  # Use `kubectl create secret generic vms-secrets --from-literal=db-url='...' --from-literal=jwt-secret='...'`
  # or enable externalSecrets in Helm values for AWS Secrets Manager integration.
stringData:
  db-url: ""  # Must be set before deploying
  jwt-secret: ""  # Must be set before deploying (64+ chars, high entropy)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recordings-pvc
  namespace: dam-vms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
