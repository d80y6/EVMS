apiVersion: v1
kind: Secret
metadata:
  name: vms-secrets
  namespace: dam-vms
type: Opaque
stringData:
  db-url: "postgres://dam_admin:dam_password@postgres:5432/dam_vms?sslmode=disable"
  jwt-secret: "change-me-to-a-strong-random-secret"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recordings-pvc
  namespace: dam-vms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
