listen_addresses = '*'
shared_preload_libraries = 'timescaledb'
wal_level = replica
archive_mode = on
archive_command = 'cp %p /wal_archive/%f'
# NOTE: Simple local archiving for docker-compose deployment.
# Production deployments should replace with S3-compatible archive command.
max_wal_senders = 3
wal_keep_size = 1024
