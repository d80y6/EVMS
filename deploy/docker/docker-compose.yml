version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: ${DB_NAME:-dam_vms}
      POSTGRES_USER: ${DB_USER:-dam_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dam_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dam_admin} -d ${DB_NAME:-dam_vms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  nats:
    image: nats:2.9-alpine
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "4222:4222"
      - "8222:8222"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth/Dockerfile
    environment:
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:-dam_password}@db:5432/${DB_NAME:-dam_vms}
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET:-secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  camera-mgmt:
    build:
      context: ../../
      dockerfile: services/camera-mgmt/Dockerfile
    environment:
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:-dam_password}@db:5432/${DB_NAME:-dam_vms}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

  ingest-service:
    build:
      context: ../../
      dockerfile: services/ingest/Dockerfile
    environment:
      - CAMERA_ID=demo_cam
      - RTSP_URL=${DEMO_RTSP_URL:-rtsp://localhost:8554/live}
      - NATS_URL=nats://nats:4222
    volumes:
      - recordings:/recordings
    depends_on:
      nats:
        condition: service_healthy

  recorder-service:
    build:
      context: ../../
      dockerfile: services/recorder/Dockerfile
    environment:
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:-dam_password}@db:5432/${DB_NAME:-dam_vms}
      - NATS_URL=nats://nats:4222
    volumes:
      - recordings:/recordings
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

  ai-worker:
    build:
      context: ../../
      dockerfile: services/ai-worker/Dockerfile
    environment:
      - CAMERA_ID=demo_cam
      - NATS_URL=nats://nats:4222
      - AI_SAMPLING_RATE=5
    depends_on:
      nats:
        condition: service_healthy

  webrtc-service:
    build:
      context: ../../
      dockerfile: services/webrtc/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=${JWT_SECRET:-secret}
    ports:
      - "8082:8082"
    depends_on:
      nats:
        condition: service_healthy

  playback-service:
    build:
      context: ../../
      dockerfile: services/playback/Dockerfile
    environment:
      - JWT_SECRET=${JWT_SECRET:-secret}
    volumes:
      - recordings:/recordings
    ports:
      - "8086:8086"

volumes:
  pgdata:
  recordings:
