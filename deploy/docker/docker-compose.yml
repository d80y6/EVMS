version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: ${DB_NAME:-dam_vms}
      POSTGRES_USER: ${DB_USER:-dam_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dam_admin} -d ${DB_NAME:-dam_vms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - wal-archive:/wal_archive
    command:
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  nats:
    image: nats:2.9-alpine
    command: ["-c", "/etc/nats/nats.conf", "-js"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    volumes:
      - ../nats/nats.conf:/etc/nats/nats.conf
      - nats-data:/data/jetstream

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/evms-dashboard.json:/etc/grafana/provisioning/dashboards/evms-dashboard.json
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/evms-dashboard.json
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml
    command: -config.file=/etc/loki/config.yaml

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./promtail/config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  openldap:
    image: osixia/openldap:latest
    environment:
      LDAP_ORGANISATION: "DAM VMS"
      LDAP_DOMAIN: "dam.vms"
      LDAP_ADMIN_PASSWORD: "${LDAP_PASSWORD:?LDAP_PASSWORD must be set}"
    ports:
      - "389:389"

  ldap-admin:
    image: osixia/phpldapadmin:latest
    ports:
      - "6443:443"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth/Dockerfile
    environment:
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/${DB_NAME:-dam_vms}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - MIGRATIONS_DIR=/migrations
      - LDAP_ENABLED=true
      - LDAP_HOST=openldap
      - LDAP_PORT=389
      - LDAP_BASE_DN=dc=dam,dc=vms
      - LDAP_BIND_DN=cn=admin,dc=dam,dc=vms
      - LDAP_PASSWORD=${LDAP_PASSWORD:?LDAP_PASSWORD must be set}
      - LDAP_FILTER=(uid=%s)
    volumes:
      - ../../migrations:/migrations
    depends_on:
      db:
        condition: service_healthy

  camera-mgmt:
    build:
      context: ../../
      dockerfile: services/camera-mgmt/Dockerfile
    environment:
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/${DB_NAME:-dam_vms}
      - MIGRATIONS_DIR=/migrations
    volumes:
      - ../../migrations:/migrations
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

  ingest-service:
    build:
      context: ../../
      dockerfile: services/ingest/Dockerfile
    environment:
      - CAMERA_ID=demo_cam
      - RTSP_URL=${DEMO_RTSP_URL:-rtsp://localhost:8554/live}
      - NATS_URL=nats://nats:4222
    volumes:
      - recordings:/recordings
    depends_on:
      nats:
        condition: service_healthy

  recorder-service:
    build:
      context: ../../
      dockerfile: services/recorder/Dockerfile
    environment:
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/${DB_NAME:-dam_vms}
      - NATS_URL=nats://nats:4222
    volumes:
      - recordings:/recordings
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

  ai-worker:
    build:
      context: ../../
      dockerfile: services/ai-worker/Dockerfile
    environment:
      - CAMERA_ID=demo_cam
      - NATS_URL=nats://nats:4222
      - AI_SAMPLING_RATE=5
    depends_on:
      nats:
        condition: service_healthy

  webrtc-service:
    build:
      context: ../../
      dockerfile: services/webrtc/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "8082:8082"
    depends_on:
      nats:
        condition: service_healthy

  discovery:
    build:
      context: ../../
      dockerfile: services/discovery/Dockerfile
    environment:
      - METRICS_ADDR=:2112
      - DISCOVERY_NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy

  camera-control:
    build:
      context: ../../
      dockerfile: services/camera-control/Dockerfile
    environment:
      - CAMERA_SERVICE_ADDR=camera-mgmt:50051
    depends_on:
      camera-mgmt:
        condition: service_started

  thumbnails:
    build:
      context: ../../
      dockerfile: services/thumbnails/Dockerfile
    environment:
      - RECORDINGS_ROOT=/recordings
      - THUMBNAIL_CACHE=/cache/thumbnails
    volumes:
      - recordings:/recordings
      - thumbnail-cache:/cache/thumbnails
    depends_on:
      db:
        condition: service_healthy

  playback-service:
    build:
      context: ../../
      dockerfile: services/playback/Dockerfile
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    volumes:
      - recordings:/recordings
    ports:
      - "8086:8086"

  api-gateway:
    build:
      context: ../../
      dockerfile: services/api-gateway/Dockerfile
    environment:
      - GATEWAY_PORT=:8090
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CAMERA_SERVICE_ADDR=camera-mgmt:50051
      - PLAYBACK_SERVICE_URL=http://playback-service:8086
      - WEBRTC_SERVICE_URL=http://webrtc-service:8082
      - CAMERA_CONTROL_URL=http://camera-control:8088
      - THUMBNAILS_URL=http://thumbnails:8089
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/${DB_NAME:-dam_vms}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
      camera-mgmt:
        condition: service_started
      camera-control:
        condition: service_started
      thumbnails:
        condition: service_started

  event-proc:
    build:
      context: ../../
      dockerfile: services/event-proc/Dockerfile
    environment:
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/${DB_NAME:-dam_vms}
      - NATS_URL=nats://nats:4222
      - ALERT_ADMIN_PORT=:8093
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

  metadata:
    build:
      context: ../../
      dockerfile: services/metadata/Dockerfile
    environment:
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/${DB_NAME:-dam_vms}
      - NATS_URL=nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

  notification:
    build:
      context: ../../
      dockerfile: services/notification/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy

  export-service:
    build:
      context: ../../
      dockerfile: services/export/Dockerfile
    volumes:
      - recordings:/recordings
      - exports:/exports
    ports:
      - "8094:8094"

  onvif-events:
    build:
      context: ../../
      dockerfile: services/onvif-events/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
      - ONVIF_EVENTS_PORT=:8092
    ports:
      - "8092:8092"
    depends_on:
      nats:
        condition: service_healthy

  audit-service:
    build:
      context: ../../
      dockerfile: services/audit/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
      - AUDIT_PORT=:8093
    depends_on:
      nats:
        condition: service_healthy

  pos-ingest:
    build:
      context: ../../
      dockerfile: services/pos-ingest/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  blur-worker:
    build:
      context: ../../
      dockerfile: services/ai-worker/Dockerfile.blur
    environment:
      - NATS_URL=nats://nats:4222
    volumes:
      - recordings:/recordings
    depends_on:
      nats:
        condition: service_healthy

volumes:
  pgdata:
  nats-data:
  wal-archive:
  recordings:
  thumbnail-cache:
  exports:
