version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: ${DB_NAME:-dam_vms}
      POSTGRES_USER: ${DB_USER:-dam_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dam_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2.9-alpine
    ports:
      - "4222:4222"
      - "8222:8222"

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:-dam_password}@db:5432/${DB_NAME:-dam_vms}
      - REDIS_URL=redis:6379
    depends_on:
      - db
      - redis

  camera-mgmt:
    build:
      context: .
      dockerfile: services/camera-mgmt/Dockerfile
    environment:
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:-dam_password}@db:5432/${DB_NAME:-dam_vms}
    depends_on:
      - db
      - nats

  ingest-service:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    environment:
      - CAMERA_ID=demo_cam
      - RTSP_URL=${DEMO_RTSP_URL:-rtsp://localhost:8554/live}
    volumes:
      - recordings:/recordings

  recorder-service:
    build:
      context: .
      dockerfile: services/recorder/Dockerfile
    environment:
      - DB_URL=postgres://${DB_USER:-dam_admin}:${DB_PASSWORD:-dam_password}@db:5432/${DB_NAME:-dam_vms}
    volumes:
      - recordings:/recordings
    depends_on:
      - db

  ai-worker:
    build:
      context: .
      dockerfile: services/ai-worker/Dockerfile
    environment:
      - CAMERA_ID=demo_cam
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats

volumes:
  pgdata:
  recordings:
