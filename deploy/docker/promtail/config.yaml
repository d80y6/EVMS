server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: evms-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            service: service
            camera_id: camera_id
            error: error
      - labels:
          level:
          service:
      - metrics:
          evms_log_entries_total:
            type: Counter
            description: "Total log entries per level"
            prefix: evms_
            config:
              source: level
              match_all: true
              action: inc
          evms_log_error_total:
            type: Counter
            description: "Total error log entries"
            config:
              source: level
              value: error
              action: inc
