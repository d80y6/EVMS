{{- if .Values.nats.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: nats-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats-auth
type: Opaque
stringData:
  nats-url-ingest: "nats://ingest:{{ .Values.nats.auth.users.ingest.password }}@nats:4222"
  nats-url-ai-worker: "nats://ai_worker:{{ .Values.nats.auth.users.aiWorker.password }}@nats:4222"
  nats-url-recorder: "nats://recorder:{{ .Values.nats.auth.users.recorder.password }}@nats:4222"
  nats-url-webrtc: "nats://webrtc:{{ .Values.nats.auth.users.webrtc.password }}@nats:4222"
  nats-url-event-processor: "nats://event_processor:{{ .Values.nats.auth.users.eventProcessor.password }}@nats:4222"
  nats-url-metadata: "nats://metadata:{{ .Values.nats.auth.users.metadata.password }}@nats:4222"
  nats-url-notification: "nats://notification:{{ .Values.nats.auth.users.notification.password }}@nats:4222"
  nats-url-audit: "nats://audit:{{ .Values.nats.auth.users.audit.password }}@nats:4222"
  nats-url-discovery: "nats://discovery:{{ .Values.nats.auth.users.discovery.password }}@nats:4222"
  nats-url-onvif-events: "nats://onvif_events:{{ .Values.nats.auth.users.onvifEvents.password }}@nats:4222"
  nats-url-pos-ingest: "nats://pos_ingest:{{ .Values.nats.auth.users.posIngest.password }}@nats:4222"
{{- end }}
