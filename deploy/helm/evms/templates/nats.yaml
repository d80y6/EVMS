apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
  - name: client
    port: {{ .Values.nats.ports.client }}
    targetPort: {{ .Values.nats.ports.client }}
  - name: cluster
    port: {{ .Values.nats.ports.cluster }}
    targetPort: {{ .Values.nats.ports.cluster }}
  - name: monitor
    port: {{ .Values.nats.ports.monitor }}
    targetPort: {{ .Values.nats.ports.monitor }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
spec:
  serviceName: nats
  replicas: {{ .Values.nats.replicas }}
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        image: {{ .Values.global.imageRegistry }}{{ .Values.nats.image }}
        ports:
        - containerPort: {{ .Values.nats.ports.client }}
          name: client
        - containerPort: {{ .Values.nats.ports.cluster }}
          name: cluster
        - containerPort: {{ .Values.nats.ports.monitor }}
          name: monitor
        livenessProbe:
          tcpSocket:
            port: {{ .Values.nats.ports.client }}
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: {{ .Values.nats.ports.client }}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
