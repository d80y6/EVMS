{{- if .Values.services.reporting.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
    app.kubernetes.io/component: reporting
spec:
  replicas: {{ .Values.services.reporting.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
    spec:
      containers:
      - name: reporting
        image: {{ include "evms.image" (dict "image" .Values.services.reporting.image "Values" .Values "global" .Values.global) }}
        ports:
        - containerPort: {{ .Values.services.reporting.port }}
        - containerPort: 2112
        livenessProbe:
          httpGet:
            path: /health
            port: 2112
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 2112
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: evms-secrets
              key: db-url
        - name: NATS_URL
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: NATS_URL
        - name: METRICS_ADDR
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: METRICS_ADDR
        - name: REPORTING_PORT
          value: ":{{ .Values.services.reporting.port }}"
        volumeMounts:
        - name: reports
          mountPath: /reports
        resources:
          {{- toYaml .Values.services.reporting.resources | nindent 10 }}
      volumes:
      - name: reports
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
    app.kubernetes.io/component: reporting
spec:
  selector:
    app: reporting-service
  ports:
  - protocol: TCP
    port: {{ .Values.services.reporting.port }}
    targetPort: {{ .Values.services.reporting.port }}
  - protocol: TCP
    port: 2112
    targetPort: 2112
  type: ClusterIP
{{- end }}
