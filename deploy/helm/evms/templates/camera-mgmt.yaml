{{- if .Values.services.cameraMgmt.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camera-mgmt
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
    app.kubernetes.io/component: camera-mgmt
spec:
  replicas: {{ .Values.services.cameraMgmt.replicas }}
  selector:
    matchLabels:
      app: camera-mgmt
  template:
    metadata:
      labels:
        app: camera-mgmt
    spec:
      containers:
      - name: camera-mgmt
        image: {{ include "evms.image" (dict "image" .Values.services.cameraMgmt.image "Values" .Values "global" .Values.global) }}
        ports:
        - containerPort: {{ .Values.services.cameraMgmt.port }}
        - containerPort: 2112
        livenessProbe:
          tcpSocket:
            port: {{ .Values.services.cameraMgmt.port }}
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: {{ .Values.services.cameraMgmt.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: evms-secrets
              key: db-url
        - name: NATS_URL
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: NATS_URL
        - name: METRICS_ADDR
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: METRICS_ADDR
        resources:
          {{- toYaml .Values.services.cameraMgmt.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: camera-mgmt
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
    app.kubernetes.io/component: camera-mgmt
spec:
  selector:
    app: camera-mgmt
  ports:
  - protocol: TCP
    port: {{ .Values.services.cameraMgmt.port }}
    targetPort: {{ .Values.services.cameraMgmt.port }}
  - protocol: TCP
    port: 2112
    targetPort: 2112
  type: ClusterIP
{{- end }}
