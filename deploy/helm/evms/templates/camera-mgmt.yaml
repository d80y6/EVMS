{{- if .Values.services.cameraMgmt.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camera-mgmt
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
    app.kubernetes.io/component: camera-mgmt
spec:
  replicas: {{ .Values.services.cameraMgmt.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: camera-mgmt
  template:
    metadata:
      labels:
        app: camera-mgmt
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - camera-mgmt
              topologyKey: kubernetes.io/hostname
      containers:
      - name: camera-mgmt
        image: {{ include "evms.image" (dict "image" .Values.services.cameraMgmt.image "Values" .Values "global" .Values.global) }}
        ports:
        - containerPort: {{ .Values.services.cameraMgmt.port }}
        - containerPort: 2112
        livenessProbe:
          tcpSocket:
            port: {{ .Values.services.cameraMgmt.port }}
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: {{ .Values.services.cameraMgmt.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: evms-secrets
              key: db-url
        - name: NATS_URL
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: NATS_URL
        - name: METRICS_ADDR
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: METRICS_ADDR
        {{- if .Values.certManager.enabled }}
        - name: TLS_CERT_FILE
          value: /etc/certs/tls.crt
        - name: TLS_KEY_FILE
          value: /etc/certs/tls.key
        - name: TLS_CA_FILE
          value: /etc/certs/ca.crt
        volumeMounts:
        - name: server-tls
          mountPath: /etc/certs
          readOnly: true
        {{- end }}
        resources:
          {{- toYaml .Values.services.cameraMgmt.resources | nindent 10 }}
      {{- if .Values.certManager.enabled }}
      volumes:
      - name: server-tls
        secret:
          secretName: camera-mgmt-tls
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: camera-mgmt
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
    app.kubernetes.io/component: camera-mgmt
spec:
  selector:
    app: camera-mgmt
  ports:
  - protocol: TCP
    port: {{ .Values.services.cameraMgmt.port }}
    targetPort: {{ .Values.services.cameraMgmt.port }}
  - protocol: TCP
    port: 2112
    targetPort: 2112
  type: ClusterIP
{{- end }}
