{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.global.namespace }}-evms
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: evms
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
{{- end }}
