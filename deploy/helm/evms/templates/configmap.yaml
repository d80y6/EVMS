apiVersion: v1
kind: ConfigMap
metadata:
  name: evms-config
  namespace: {{ .Values.global.namespace }}
data:
  NATS_URL: "nats://nats:{{ .Values.nats.ports.client }}"
  DB_HOST: {{ .Values.db.host }}
  DB_PORT: {{ .Values.db.port | quote }}
  DB_NAME: {{ .Values.db.name }}
  DB_USER: {{ .Values.db.user }}
  REDIS_HOST: {{ .Values.redis.host }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  LDAP_ENABLED: {{ .Values.ldap.enabled | quote }}
  LDAP_HOST: {{ .Values.ldap.host }}
  LDAP_PORT: {{ .Values.ldap.port | quote }}
  LDAP_BASE_DN: {{ .Values.ldap.baseDn }}
  LDAP_BIND_DN: {{ .Values.ldap.bindDn }}
  LDAP_FILTER: {{ .Values.ldap.filter }}
  RECORDINGS_ROOT: /recordings
  THUMBNAIL_CACHE: /cache/thumbnails
  METRICS_ADDR: ":2112"
  RETENTION_DAYS: {{ .Values.services.recorder.retentionDays | quote }}
