{{- if .Values.internalCerts.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-tls
  namespace: {{ .Values.global.namespace }}
spec:
  secretName: nats-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: internal-ca
    kind: Issuer
  commonName: nats.{{ .Values.global.namespace }}.svc.cluster.local
  dnsNames:
  - nats.{{ .Values.global.namespace }}.svc.cluster.local
  - "*.nats.{{ .Values.global.namespace }}.svc.cluster.local"
  usages:
  - server auth
  - client auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grpc-tls
  namespace: {{ .Values.global.namespace }}
spec:
  secretName: grpc-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: internal-ca
    kind: Issuer
  commonName: "*.svc.cluster.local"
  dnsNames:
  - "*.svc.cluster.local"
  usages:
  - server auth
  - client auth
---
{{- end }}
