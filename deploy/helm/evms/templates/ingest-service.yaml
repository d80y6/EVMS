{{- if .Values.services.ingest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  replicas: {{ .Values.services.ingest.replicas }}
  selector:
    matchLabels:
      app: ingest-service
  template:
    metadata:
      labels:
        app: ingest-service
    spec:
      containers:
      - name: ingest
        image: {{ include "evms.image" (dict "image" .Values.services.ingest.image "Values" .Values "global" .Values.global) }}
        ports:
        - containerPort: 2112
        livenessProbe:
          httpGet:
            path: /health
            port: 2112
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 2112
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: NATS_URL
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: NATS_URL
        - name: METRICS_ADDR
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: METRICS_ADDR
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: evms-secrets
              key: db-url
        volumeMounts:
        - name: recordings
          mountPath: /recordings
        resources:
          {{- toYaml .Values.services.ingest.resources | nindent 10 }}
      volumes:
      - name: recordings
        persistentVolumeClaim:
          claimName: recordings-pvc
{{- end }}
