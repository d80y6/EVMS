{{- if .Values.services.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  replicas: {{ .Values.services.apiGateway.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api-gateway
              topologyKey: kubernetes.io/hostname
      containers:
      - name: api-gateway
        image: {{ include "evms.image" (dict "image" .Values.services.apiGateway.image "Values" .Values "global" .Values.global) }}
        ports:
        - containerPort: {{ .Values.services.apiGateway.port }}
        - containerPort: 2112
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.services.apiGateway.port }}
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.services.apiGateway.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: evms-secrets
              key: jwt-secret
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: evms-secrets
              key: db-url
        - name: NATS_URL
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: NATS_URL
        - name: METRICS_ADDR
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: METRICS_ADDR
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: REDIS_PORT
        {{- if .Values.certManager.enabled }}
        - name: TLS_CA_FILE
          value: /etc/ca-certs/ca.crt
        - name: TLS_CERT_FILE
          value: /etc/ca-certs/tls.crt
        - name: TLS_KEY_FILE
          value: /etc/ca-certs/tls.key
        volumeMounts:
        - name: ca-cert
          mountPath: /etc/ca-certs
          readOnly: true
        {{- end }}
        resources:
          {{- toYaml .Values.services.apiGateway.resources | nindent 10 }}
      {{- if .Values.certManager.enabled }}
      volumes:
      - name: ca-cert
        secret:
          secretName: evms-internal-ca-tls
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
  - protocol: TCP
    port: {{ .Values.services.apiGateway.port }}
    targetPort: {{ .Values.services.apiGateway.port }}
  - protocol: TCP
    port: 2112
    targetPort: 2112
{{- if .Values.services.apiGateway.tls.enabled }}
  type: LoadBalancer
{{- else }}
  type: ClusterIP
{{- end }}
{{- end }}
