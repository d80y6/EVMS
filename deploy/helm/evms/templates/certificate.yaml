{{- if and .Values.certManager.enabled .Values.ingress.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.clusterIssuer.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.certManager.clusterIssuer.server }}
    email: {{ .Values.certManager.clusterIssuer.email | default .Values.ingress.email | quote }}
    privateKeySecretRef:
      name: {{ .Values.certManager.clusterIssuer.privateKeySecretRef.name }}
    solvers:
    {{- toYaml .Values.certManager.clusterIssuer.solvers | nindent 6 }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: evms-tls
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
spec:
  secretName: evms-tls
  issuerRef:
    name: {{ .Values.certManager.clusterIssuer.name }}
    kind: ClusterIssuer
  dnsNames:
  - {{ .Values.ingress.domain }}
{{- end }}
