{{- if .Values.services.blurWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blur-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "evms.labels" . | nindent 4 }}
    app.kubernetes.io/component: blur-worker
spec:
  replicas: {{ .Values.services.blurWorker.replicas }}
  selector:
    matchLabels:
      app: blur-worker
  template:
    metadata:
      labels:
        app: blur-worker
    spec:
      containers:
      - name: blur-worker
        image: {{ include "evms.image" (dict "image" .Values.services.blurWorker.image "Values" .Values "global" .Values.global) }}
        ports:
        - containerPort: 2112
        livenessProbe:
          httpGet:
            path: /health
            port: 2112
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 2112
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: NATS_URL
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: NATS_URL
        - name: METRICS_ADDR
          valueFrom:
            configMapKeyRef:
              name: evms-config
              key: METRICS_ADDR
        resources:
          {{- toYaml .Values.services.blurWorker.resources | nindent 10 }}
{{- end }}
