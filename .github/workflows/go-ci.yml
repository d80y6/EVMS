name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Build all services
        run: go build ./...
      - name: Run tests
        run: go test ./... -count=1
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      - if: github.ref == 'refs/heads/main'
        name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        name: Build and push Docker images
        run: |
          for service in auth camera-mgmt recorder playback webrtc camera-control thumbnails discovery event-proc export audit pos-ingest ingest notification metadata onvif-events; do
            docker build -f services/$service/Dockerfile -t $REGISTRY/damvms/$service:$IMAGE_TAG -t $REGISTRY/damvms/$service:latest .
            docker push $REGISTRY/damvms/$service:$IMAGE_TAG
            docker push $REGISTRY/damvms/$service:latest
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
